[package]
name = "llm"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
bytes = "1"
derive_more = { version = "2", features = ["display", "from", "into", "deref", "is_variant"] }
futures = "0.3"
morphium = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[lints]
workspace = true
